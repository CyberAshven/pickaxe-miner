name: apply-stratum-main-patch
on:
  workflow_dispatch:
  push:
    branches: [feat/bch-stratum-v2]
    paths:
      - 'src/stratum_v2/main.rs.diff'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bch-stratum-v2
      - name: Apply patch and commit main.rs
        run: |
          set -euo pipefail
          patch -p1 < src/stratum_v2/main.rs.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          git commit -m "feat(stratum-v2): wire Status dispatch in main + ungate CLI"
          git push origin HEAD:feat/bch-stratum-v2
