name: CI

on:
  push:
    branches:
      - master
      - dev
      - assistant-runtime-control
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # #### PR #22
  # Native and browser portability checks belong to the same commit-level CI.
  # Packaging remains read-only; this call cannot create a tag or release.
  portable:
    name: Shared portable application
    uses: ./.github/workflows/portable.yml
    with:
      source-ref: ${{ github.sha }}

  rust-ptx:
    name: Rust PTX ${{ matrix.arch }} (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [sm_75, sm_120]
        backend: [pickaxe, upstream]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust GPU compiler
        run: rustup toolchain install nightly-2026-04-02 --profile minimal --component rust-src,llvm-tools-preview,llvm-bitcode-linker
      - name: Compile Rust kernels without a CUDA C++ toolchain
        shell: pwsh
        run: |
          $legacy = if ('${{ matrix.backend }}' -eq 'pickaxe') { @{ Upstream = $false } } else { @{} }
          ./tools/build-rust-kernels.ps1 -Architecture ${{ matrix.arch }} @legacy

  reward-policy-vm:
    name: BCH 2026 reward-policy VM proof
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/reward-policy-vm/package-lock.json

      - name: Install proof dependencies
        working-directory: tools/reward-policy-vm
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Rust for direct payout lifecycle proof
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify BCH 2026 settlement
        working-directory: tools/reward-policy-vm
        run: npm test

  hip-gfx1036:
    name: HIP gfx1036 code objects
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test HIP artifact validation
        run: python3 -m unittest discover -s tools -p 'test_hip_*.py' -v

      - name: Install pinned ROCm HIP compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl gpg python3
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key |
            gpg --batch --yes --dearmor |
            sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.0.2 noble main' |
            sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxml2 \
            rocm-llvm=20.0.0.25385.70002-56~24.04 \
            rocm-device-libs=1.0.0.70002-56~24.04 \
            hip-dev=7.0.51831.70002-56~24.04 \
            hipcc=1.1.1.70002-56~24.04

      - name: Install pinned Rust GPU compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-04-02 --profile minimal --component rust-src

      - name: Build and verify gfx1036 HSACO set
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/rocm/bin:/opt/rocm/lib/llvm/bin:/opt/rocm/llvm/bin:${PATH}"
          hipcc --version
          python3 tools/build_hip.py --arch gfx1036 --check-reproducible
          python3 -m unittest tools.test_verify_hip_artifacts -v
          python3 tools/build_rust_amd.py --arch gfx1036
          (cd hip/build/gfx1036 && sha256sum *.hsaco | sort -k2 > SHA256SUMS.txt)
          cat hip/build/gfx1036/SHA256SUMS.txt

      - name: Upload verified gfx1036 code objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hip-gfx1036-${{ github.sha }}
          path: hip/build/gfx1036/
          if-no-files-found: error
          retention-days: 14

  hip-discrete:
    name: HIP ${{ matrix.arch }} code objects
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Discrete Radeon RDNA2, RDNA3 and RDNA4 targets for native HIP T2.
        arch: [gfx1030, gfx1031, gfx1032, gfx1034, gfx1100, gfx1101, gfx1102, gfx1200, gfx1201]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned ROCm HIP compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl gpg python3
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key |
            gpg --batch --yes --dearmor |
            sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.0.2 noble main' |
            sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxml2 \
            rocm-llvm=20.0.0.25385.70002-56~24.04 \
            rocm-device-libs=1.0.0.70002-56~24.04 \
            hip-dev=7.0.51831.70002-56~24.04 \
            hipcc=1.1.1.70002-56~24.04

      - name: Install pinned Rust GPU compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-04-02 --profile minimal --component rust-src

      - name: Build and verify ${{ matrix.arch }} HSACO set
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/rocm/bin:/opt/rocm/lib/llvm/bin:/opt/rocm/llvm/bin:${PATH}"
          python3 tools/build_hip.py --arch "${{ matrix.arch }}" --check-reproducible
          python3 tools/build_rust_amd.py --arch "${{ matrix.arch }}"
          (cd "hip/build/${{ matrix.arch }}" && sha256sum *.hsaco | sort -k2 > SHA256SUMS.txt)
          cat "hip/build/${{ matrix.arch }}/SHA256SUMS.txt"

      - name: Upload verified ${{ matrix.arch }} code objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hip-${{ matrix.arch }}-${{ github.sha }}
          path: hip/build/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  # #### PR #38
  # Exercise the wire with an unmodified, pinned independent client. Synthetic
  # BCH templates and one throttled CPU thread need neither a node nor a GPU.
  sv2-reference:
    name: Independent SV2 reference device
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sv2-reference
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout pinned SRI client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stratum-mining/sv2-apps
          ref: 3772e9d890dc7ec23bc82bcead41879542902402
          path: .reference/sv2-apps
          persist-credentials: false
      - name: Install reference build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev libssl-dev pkg-config
          rustup toolchain install 1.98.1 --profile minimal
      - name: Build unmodified reference device
        run: |
          cargo build --locked --manifest-path .reference/sv2-apps/Cargo.toml -p integration_tests_sv2 --bin mining_device
          sha256sum .reference/sv2-apps/Cargo.lock "$CARGO_TARGET_DIR/debug/mining_device"
      - name: Verify pinned identity and successor blocks
        env:
          PICKAXE_SV2_REFERENCE_DEVICE: ${{ github.workspace }}/target/sv2-reference/debug/mining_device
        run: cargo test --locked --no-default-features --features stratum-v2 --lib upstream_reference_device_authenticates_and_mines_successor_blocks -- --ignored --test-threads=1

  rust:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
          # #### PR #32: native ARM64 builds on GitHub's ARM64 runners, for
          # ARM boards and laptops (Raspberry Pi 5, Ampere, Snapdragon); the
          # portable engine mines there. Their binaries are uploaded below.
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Windows ARM64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install rustup where the ARM64 image lacks it
        if: runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
              ./rustup-init.exe -y --profile minimal --default-toolchain none
              echo "${USERPROFILE}\.cargo\bin" >> "${GITHUB_PATH}"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
            fi
          fi

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Test release channel policy
        if: runner.arch == 'X64'
        shell: bash
        run: python -m unittest discover -s tools -p 'test_release_channel.py' -v

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --all-targets

      - name: Check legacy CUDA backend
        run: cargo check --locked --all-targets --no-default-features --features tail-grind

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast -- --skip if_cuda

      - name: Rust engine arithmetic oracles
        run: cargo test --locked --manifest-path rust-engine/Cargo.toml

      - name: Rust engine formatting and lint
        run: |
          cargo fmt --manifest-path rust-engine/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust-engine/Cargo.toml --all-targets -- -D warnings

      - name: Rust dependency security policy
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: bash tools/check-rust-deps.sh

      - name: Release build
        run: cargo build --locked --release

      - name: Verify interactive TUI binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="target/release/pickaxe_miner.exe"
          else
            bin="target/release/pickaxe_miner"
          fi
          test -f "${bin}"
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          help="$(${bin} --help | tr -d '\r')"
          printf '%s\n' "${help}" | grep -q -- '--no-tui'
          printf '%s\n' "${help}" | grep -q -- '--intensity'
          printf '%s\n' "${help}" | grep -q 'mine'
          test "$(${bin} --version | tr -d '\r')" = "pickaxe ${version}"

      - name: Upload ARM64 binary for testers
        if: runner.arch == 'ARM64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pickaxe-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-arm64-${{ github.sha }}
          path: target/release/pickaxe_miner${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14
