name: CI

on:
  push:
    branches:
      - master
      - assistant-runtime-control
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  reward-policy-vm:
    name: BCH 2026 reward-policy VM proof
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/reward-policy-vm/package-lock.json

      - name: Install proof dependencies
        working-directory: tools/reward-policy-vm
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify BCH 2026 settlement
        working-directory: tools/reward-policy-vm
        run: npm test

  hip-gfx1036:
    name: HIP gfx1036 code objects
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test HIP artifact validation
        run: python3 -m unittest discover -s tools -p 'test_hip_*.py' -v

      - name: Install pinned ROCm HIP compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl gpg python3
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key |
            gpg --batch --yes --dearmor |
            sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.0.2 noble main' |
            sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxml2 \
            rocm-llvm=20.0.0.25385.70002-56~24.04 \
            rocm-device-libs=1.0.0.70002-56~24.04 \
            hip-dev=7.0.51831.70002-56~24.04 \
            hipcc=1.1.1.70002-56~24.04

      - name: Build and verify gfx1036 HSACO set
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/rocm/bin:/opt/rocm/lib/llvm/bin:/opt/rocm/llvm/bin:${PATH}"
          hipcc --version
          python3 tools/build_hip.py --arch gfx1036 --check-reproducible
          python3 -m unittest tools.test_verify_hip_artifacts -v
          (cd hip/build/gfx1036 && sha256sum *.hsaco | sort -k2 > SHA256SUMS.txt)
          cat hip/build/gfx1036/SHA256SUMS.txt

      - name: Upload verified gfx1036 code objects
        uses: actions/upload-artifact@v7
        with:
          name: hip-gfx1036-${{ github.sha }}
          path: hip/build/gfx1036/
          if-no-files-found: error
          retention-days: 14

  rust:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast -- --skip if_cuda

      - name: Release build
        run: cargo build --locked --release
