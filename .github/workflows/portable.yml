name: Portable builds

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    name: Experimental macOS ARM64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Check shared application and Metal backend
        run: |
          rustup default stable
          test "$(uname -m)" = arm64
          cargo clippy --locked --all-targets --no-default-features --features portable-wgpu -- -D warnings
          cargo test --locked --no-default-features --features portable-wgpu -- --skip if_cuda --skip if_wgpu
          cargo build --locked --release --no-default-features --features portable-wgpu
          target/release/pickaxe_miner --version
          target/release/pickaxe_miner --help
      - name: Package experimental command-line archive
        run: |
          mkdir -p dist/pickaxe-macos-arm64-experimental
          cp target/release/pickaxe_miner dist/pickaxe-macos-arm64-experimental/pickaxe
          cp LICENSE docs/portable.md dist/pickaxe-macos-arm64-experimental/
          git rev-parse HEAD > dist/pickaxe-macos-arm64-experimental/SOURCE_COMMIT.txt
          tar -czf dist/pickaxe-macos-arm64-experimental.tar.gz -C dist pickaxe-macos-arm64-experimental
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pickaxe-macos-arm64-experimental-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  browser:
    name: Shared Rust WebGPU WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang
          cargo install --locked wasm-bindgen-cli --version 0.2.128
      - name: Check browser engine and transport
        run: |
          cargo clippy --locked --lib --no-default-features --features portable-wgpu --target wasm32-unknown-unknown -- -D warnings
          node --test web/rpc.test.mjs
          python3 tools/build-browser.py
          node web/smoke.mjs
      - name: Package static browser application
        run: |
          git rev-parse HEAD > dist/web/SOURCE_COMMIT.txt
          cp docs/portable.md dist/web/README.md
          tar -czf dist/pickaxe-web-experimental.tar.gz -C dist web
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pickaxe-web-experimental-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
