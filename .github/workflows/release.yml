name: Release

# Release modes:
# - push to master: tag pickaxe-miner-v<Cargo.toml version> on the pushed
#   commit and publish it, unless that tag already exists (no version bump).
#   A push that only changes Markdown files or docs/ never starts a release
#   (paths-ignore below; GitHub does not apply path filters to tag pushes).
# - pull_request to master/dev: dry run of the same build and packaging; nothing
#   is tagged or published.
# - push of a pickaxe-miner-v* tag, or manual dispatch with an existing tag:
#   build and publish that tag. Prereleases must be reachable from dev;
#   stable releases must be reachable from master. Dev pushes never publish.
on:
  push:
    branches:
      - master
    tags:
      - "pickaxe-miner-v*.*.*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - master
      - dev
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/portable.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "cuda/build/**"
      - "tools/build_hip.py"
      - "tools/build-rust-kernels.ps1"
      - "tools/test_release_channel.py"
      - "packaging/farm-os/**"
      - "tools/farm-os/**"
      - "tools/test_farm_os_packages.py"
      - "rust-engine/**"
      - "src/**"
      - "web/**"
      - "tools/build-browser.py"
      - "tools/shared-gpu-proof/**"
      - "reference/shared-t2/**"
      - "protocol/**"
      - "build.rs"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic tag to build and publish, e.g. pickaxe-miner-v0.0.1"
        required: true
        type: string
      source_commit:
        description: "Optional full merged commit SHA to replace this release's downloads without moving its tag"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # #### PR #22: package every platform from the validated source revision.
  # The reusable workflow only builds artifacts; publication stays below and
  # remains skipped for pull requests, dev merges and unchanged versions.
  portable:
    name: Portable release packages
    needs: validate
    if: needs.validate.outputs.mode != 'skip'
    uses: ./.github/workflows/portable.yml
    with:
      source-ref: ${{ needs.validate.outputs.sha }}

  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      mode: ${{ steps.release.outputs.mode }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_commit || inputs.tag) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          PUSH_REF_TYPE: ${{ github.ref_type }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"

          # mode: publish (existing tag), create (new tag on this commit),
          # dry-run (pull request), skip (master push without a new version).
          case "${GITHUB_EVENT_NAME}:${PUSH_REF_TYPE}" in
            push:tag)
              tag="${PUSH_TAG}"
              mode="publish"
              ;;
            workflow_dispatch:*)
              tag="${MANUAL_TAG}"
              mode="publish"
              ;;
            push:branch)
              tag="pickaxe-miner-v${version}"
              if git ls-remote --exit-code --tags "${REPO_URL}" "refs/tags/${tag}" >/dev/null; then
                mode="skip"
                echo "::notice::${tag} already exists; bump Cargo.toml version to publish a new release."
              else
                mode="create"
              fi
              ;;
            pull_request:*)
              tag="pickaxe-miner-v${version}"
              mode="dry-run"
              ;;
            *)
              echo "Unsupported release trigger ${GITHUB_EVENT_NAME}:${PUSH_REF_TYPE}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${tag}" =~ ^pickaxe-miner-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          echo "Release ${tag} from ${sha} (${mode})"
          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "mode=${mode}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Require Cargo version to match tag
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, os, sys; d=json.load(sys.stdin); root=os.path.abspath("Cargo.toml"); p=next(p for p in d["packages"] if os.path.abspath(p["manifest_path"]) == root); print(p["version"])'
          )"

          if [[ "pickaxe-miner-v${version}" != "${TAG}" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml version pickaxe-miner-v${version}" >&2
            exit 1
          fi

          echo "Release version: ${version}"

      - name: Verify release channel
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MODE: ${{ steps.release.outputs.mode }}
          SHA: ${{ steps.release.outputs.sha }}
          BRANCH: ${{ github.base_ref || github.ref_name }}
          REBUILD_SHA: ${{ inputs.source_commit }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${TAG#pickaxe-miner-v}"
          if [[ "${MODE}" != "publish" && "${BRANCH}" == "master" && "${version}" == *-* ]]; then
            echo "Remove the prerelease suffix before promoting to master." >&2
            exit 1
          fi
          case "${MODE}" in
            dry-run|skip) exit 0 ;;
            create|publish) ;;
            *) echo "Unknown release mode: ${MODE}" >&2; exit 1 ;;
          esac
          channel=master
          if [[ "${version}" == *-* ]]; then channel=dev; fi
          git fetch --no-tags origin "${channel}"
          if ! git merge-base --is-ancestor "${SHA}" FETCH_HEAD; then
            echo "${TAG} must point to a reviewed commit on ${channel}." >&2
            exit 1
          fi
          if [[ -n "${REBUILD_SHA:-}" ]]; then
            if [[ "${MODE}" != "publish" || ! "${REBUILD_SHA}" =~ ^[0-9a-f]{40}$ || "${REBUILD_SHA}" != "${SHA}" || "${SHA}" != "${WORKFLOW_SHA}" ]]; then
              echo "A download replacement must build the exact merged workflow commit." >&2
              exit 1
            fi
            git merge-base --is-ancestor "refs/tags/${TAG}" "${SHA}"
          fi

  hip-gfx1036:
    name: Build HIP gfx1036 code objects
    needs: validate
    if: needs.validate.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install pinned ROCm HIP compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl gpg python3
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key |
            gpg --batch --yes --dearmor |
            sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.0.2 noble main' |
            sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxml2 \
            rocm-llvm=20.0.0.25385.70002-56~24.04 \
            rocm-device-libs=1.0.0.70002-56~24.04 \
            hip-dev=7.0.51831.70002-56~24.04 \
            hipcc=1.1.1.70002-56~24.04

      - name: Install pinned Rust GPU compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-04-02 --profile minimal --component rust-src

      - name: Build and verify gfx1036 HSACO set
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/rocm/bin:/opt/rocm/lib/llvm/bin:/opt/rocm/llvm/bin:${PATH}"
          hipcc --version
          python3 tools/build_hip.py --arch gfx1036 --check-reproducible
          python3 -m unittest tools.test_verify_hip_artifacts -v
          python3 tools/build_rust_amd.py --arch gfx1036
          (cd hip/build/gfx1036 && sha256sum *.hsaco | sort -k2 > SHA256SUMS.txt)
          cat hip/build/gfx1036/SHA256SUMS.txt

      - name: Upload gfx1036 code objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hip-gfx1036-codeobjects
          path: hip/build/gfx1036/
          if-no-files-found: error
          retention-days: 14

  hip-discrete:
    name: Build HIP ${{ matrix.arch }} code objects
    needs: validate
    if: needs.validate.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Discrete Radeon RDNA2, RDNA3 and RDNA4 targets for native HIP T2.
        arch: [gfx1030, gfx1031, gfx1032, gfx1034, gfx1100, gfx1101, gfx1102, gfx1200, gfx1201]

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install pinned ROCm HIP compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl gpg python3
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key |
            gpg --batch --yes --dearmor |
            sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.0.2 noble main' |
            sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxml2 \
            rocm-llvm=20.0.0.25385.70002-56~24.04 \
            rocm-device-libs=1.0.0.70002-56~24.04 \
            hip-dev=7.0.51831.70002-56~24.04 \
            hipcc=1.1.1.70002-56~24.04

      - name: Install pinned Rust GPU compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-04-02 --profile minimal --component rust-src

      - name: Build and verify ${{ matrix.arch }} HSACO set
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/rocm/bin:/opt/rocm/lib/llvm/bin:/opt/rocm/llvm/bin:${PATH}"
          python3 tools/build_hip.py --arch "${{ matrix.arch }}" --check-reproducible
          python3 tools/build_rust_amd.py --arch "${{ matrix.arch }}"
          (cd "hip/build/${{ matrix.arch }}" && sha256sum *.hsaco | sort -k2 > SHA256SUMS.txt)
          cat "hip/build/${{ matrix.arch }}/SHA256SUMS.txt"

      - name: Upload ${{ matrix.arch }} code objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hip-${{ matrix.arch }}-codeobjects
          path: hip/build/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.name }}
    needs:
      - validate
      - hip-gfx1036
      - hip-discrete
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: release-linux-x86_64
            arch: x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: release-windows-x86_64
            arch: x86_64
          # #### PR #32: ARM64 packages, built natively on GitHub's ARM64
          # runners. They mine through the portable engine (and OpenCL where
          # that is the only driver); CUDA PTX and HIP code objects target
          # x86_64 GPUs and stay out of them.
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            artifact: release-linux-arm64
            arch: arm64
          - name: Windows ARM64
            os: windows-11-arm
            artifact: release-windows-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install rustup where the ARM64 image lacks it
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
              ./rustup-init.exe -y --profile minimal --default-toolchain none
              echo "${USERPROFILE}\.cargo\bin" >> "${GITHUB_PATH}"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
            fi
          fi

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/reward-policy-vm/package-lock.json

      - name: Install reward-policy proof dependencies
        working-directory: tools/reward-policy-vm
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify BCH 2026 reward policy
        working-directory: tools/reward-policy-vm
        run: npm test

      - name: Download verified HIP code objects
        if: matrix.arch == 'x86_64'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hip-*-codeobjects
          path: hip/downloaded

      - name: Place HIP code objects by architecture
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          for directory in hip/downloaded/hip-*-codeobjects; do
            arch="${directory#hip/downloaded/hip-}"
            arch="${arch%-codeobjects}"
            mkdir -p "hip/build/${arch}"
            cp -R "${directory}/." "hip/build/${arch}/"
          done
          rm -rf hip/downloaded
          ls hip/build

      - name: Release tests
        run: cargo test --locked --release --all-features --no-fail-fast -- --skip if_cuda

      - name: Build Rust CUDA kernels
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          rustup toolchain install nightly-2026-04-02 --profile minimal --component rust-src,llvm-tools-preview,llvm-bitcode-linker
          if ($LASTEXITCODE -ne 0) { throw "Rust GPU compiler installation failed" }
          ./tools/build-rust-kernels.ps1 -Architecture sm_120

      - name: Build release
        run: cargo build --locked --release

      - name: Verify interactive TUI binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="target/release/pickaxe_miner.exe"
          else
            bin="target/release/pickaxe_miner"
          fi
          test -f "${bin}"
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          help="$(${bin} --help | tr -d '\r')"
          printf '%s\n' "${help}" | grep -q -- '--no-tui'
          printf '%s\n' "${help}" | grep -q -- '--intensity'
          printf '%s\n' "${help}" | grep -q 'mine'
          test "$(${bin} --version | tr -d '\r')" = "pickaxe ${version}"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          bin_name="$(
            cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, os, sys; d=json.load(sys.stdin); root=os.path.abspath("Cargo.toml"); p=next(p for p in d["packages"] if os.path.abspath(p["manifest_path"]) == root); print(next(t["name"] for t in p["targets"] if "bin" in t["kind"]))'
          )"

          bin="target/release/${bin_name}"
          test -f "${bin}"

          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "pickaxe-miner-v${version}" != "${TAG}" ]]; then
            echo "Tag ${TAG} does not match archive stem pickaxe-miner-v${version}" >&2
            exit 1
          fi
          package="pickaxe-miner-v${version}-linux-${ARCH}"
          mkdir -p "dist/${package}"
          install -m 0755 "${bin}" "dist/${package}/pickaxe"

          if [[ "${ARCH}" == "x86_64" ]]; then
          mkdir -p "dist/${package}/cuda/build"
          for artifact in \
            photon_rust.ptx \
            stage_a_rfc6979.ptx \
            photon_stage_b16.ptx \
            photon_c1_schnorr.ptx \
            photon_c3_dual.ptx \
            photon_t2_tail.ptx \
            photon_incremental_k.ptx \
            photon_incremental_c3.ptx \
            stage_c_hash.ptx; do
            test -s "cuda/build/${artifact}"
            grep -q '^\.target sm_120$' "cuda/build/${artifact}"
            cp "cuda/build/${artifact}" "dist/${package}/cuda/build/"
          done

          for arch in gfx1030 gfx1031 gfx1032 gfx1034 gfx1036 gfx1100 gfx1101 gfx1102 gfx1200 gfx1201; do
            for artifact in \
              stage_a_rfc6979.hsaco \
              photon_stage_b16.hsaco \
              photon_c1_schnorr.hsaco \
              stage_c_hash.hsaco \
              photon_t2_tail.hsaco \
              photon_rust.hsaco; do
              test -s "hip/build/${arch}/${artifact}"
            done
          done
          mkdir -p "dist/${package}/hip"
          cp -R hip/build "dist/${package}/hip/"

          {
            echo "Pickaxe Miner v${version}"
            echo "Platform: Linux x86_64. This archive is not ARM, ARM64, or macOS."
            echo "Interactive TUI: ./pickaxe mine. Headless: ./pickaxe mine --no-tui."
            echo "NVIDIA CUDA PTX in cuda/build is sm_120 only. A driver that can load sm_120 is required."
            echo "NVIDIA CUDA T2 mining uses the Rust backend."
            echo "AMD HIP T2 code objects in hip/build/<arch> cover gfx1030, gfx1031, gfx1032, gfx1034, gfx1036, gfx1100, gfx1101, gfx1102, gfx1200, gfx1201 and were built by this workflow."
            echo "Each folder also holds photon_rust.hsaco from the shared Rust engine; PICKAXE_HIP_KERNELS=rust selects it, C++ stays the default."
            echo "Other AMD and Intel GPUs, and integrated GPUs, mine through the included Vulkan (wgpu) T2 engine."
            echo "GPUs no other engine finds mine through the included OpenCL engine."
            echo "No CPU mining fallback."
          } > "dist/${package}/BACKENDS.txt"
          else
          {
            echo "Pickaxe Miner v${version}"
            echo "Platform: Linux ARM64 (aarch64). This archive is not x86_64 or macOS."
            echo "Interactive TUI: ./pickaxe mine. Headless: ./pickaxe mine --no-tui."
            echo "GPUs mine through the included portable (Vulkan, wgpu) T2 engine, or through the OpenCL engine when OpenCL is a GPU's only driver."
            echo "NVIDIA CUDA and AMD HIP kernels target x86_64 machines and are not included."
            echo "Not yet run on ARM hardware; please report results."
            echo "No CPU mining fallback."
          } > "dist/${package}/BACKENDS.txt"
          fi

          if [[ -f README.md ]]; then
            cp README.md "dist/${package}/"
          fi
          for license in LICENSE LICENSE-*; do
            if [[ -f "${license}" ]]; then
              cp "${license}" "dist/${package}/"
            fi
          done

          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $manifest = (Resolve-Path 'Cargo.toml').Path
          $package = $metadata.packages |
            Where-Object { [IO.Path]::GetFullPath($_.manifest_path) -eq $manifest } |
            Select-Object -First 1
          if (-not $package) {
            throw 'Could not identify the root Cargo package.'
          }

          $binTarget = $package.targets |
            Where-Object { $_.kind -contains 'bin' } |
            Select-Object -First 1
          if (-not $binTarget) {
            throw 'Could not identify the Pickaxe binary target.'
          }

          $binary = Join-Path 'target\release' ($binTarget.name + '.exe')
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Release binary not found: $binary"
          }

          $versionLine = Select-String -LiteralPath 'Cargo.toml' -Pattern '^version = "(?<version>[^"]+)"' | Select-Object -First 1
          if (-not $versionLine) {
            throw 'Cargo.toml is missing a version.'
          }
          $version = $versionLine.Matches[0].Groups['version'].Value
          if ($env:TAG -ne "pickaxe-miner-v$version") {
            throw "Tag $env:TAG does not match archive stem pickaxe-miner-v$version"
          }
          $packageName = "pickaxe-miner-v$version-windows-$env:ARCH"
          $packageDir = Join-Path 'dist' $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $packageDir 'pickaxe.exe')

          if ($env:ARCH -eq 'arm64') {
            @(
              "Pickaxe Miner v$version"
              'Platform: Windows ARM64. This archive is not x86_64 or macOS.'
              'Interactive TUI: .\pickaxe.exe mine. Headless: .\pickaxe.exe mine --no-tui.'
              'GPUs mine through the included portable (Vulkan or DirectX 12, wgpu) T2 engine, or through the OpenCL engine when OpenCL is a GPU''s only driver.'
              'NVIDIA CUDA and AMD HIP kernels target x86_64 machines and are not included.'
              'Not yet run on ARM hardware; please report results.'
              'No CPU mining fallback.'
            ) | Set-Content -LiteralPath (Join-Path $packageDir 'BACKENDS.txt') -Encoding utf8
            if (Test-Path -LiteralPath 'README.md') {
              Copy-Item -LiteralPath 'README.md' -Destination $packageDir
            }
            Get-ChildItem -File -Filter 'LICENSE*' | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $packageDir
            }
            $archive = Join-Path 'dist' ($packageName + '.zip')
            Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $archive -Force
            Remove-Item -LiteralPath $packageDir -Recurse -Force
            return
          }

          $cudaDir = Join-Path $packageDir 'cuda\build'
          New-Item -ItemType Directory -Force -Path $cudaDir | Out-Null
          $requiredPtx = @(
            'photon_rust.ptx',
            'stage_a_rfc6979.ptx',
            'photon_stage_b16.ptx',
            'photon_c1_schnorr.ptx',
            'photon_c3_dual.ptx',
            'photon_t2_tail.ptx',
            'photon_incremental_k.ptx',
            'photon_incremental_c3.ptx',
            'stage_c_hash.ptx'
          )
          foreach ($artifact in $requiredPtx) {
            $artifactPath = Join-Path 'cuda\build' $artifact
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "Required sm_120 CUDA PTX not found: $artifactPath"
            }
            $targetLine = Select-String -LiteralPath $artifactPath -Pattern '^\.target sm_120$' -Quiet
            if (-not $targetLine) {
              throw "CUDA PTX is not sm_120: $artifactPath"
            }
            Copy-Item -LiteralPath $artifactPath -Destination $cudaDir
          }

          $requiredHipArtifacts = @(
            'stage_a_rfc6979.hsaco',
            'photon_stage_b16.hsaco',
            'photon_c1_schnorr.hsaco',
            'stage_c_hash.hsaco',
            'photon_t2_tail.hsaco',
            'photon_rust.hsaco'
          )
          foreach ($arch in @('gfx1030', 'gfx1031', 'gfx1032', 'gfx1034', 'gfx1036', 'gfx1100', 'gfx1101', 'gfx1102', 'gfx1200', 'gfx1201')) {
            foreach ($artifact in $requiredHipArtifacts) {
              $artifactPath = Join-Path (Join-Path 'hip\build' $arch) $artifact
              if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
                throw "Required $arch HIP artifact not found: $artifactPath"
              }
            }
          }
          $hipDir = Join-Path $packageDir 'hip'
          New-Item -ItemType Directory -Force -Path $hipDir | Out-Null
          Copy-Item -LiteralPath 'hip\build' -Destination $hipDir -Recurse

          @(
            "Pickaxe Miner v$version"
            'Platform: Windows x86_64. This archive is not ARM, ARM64, or macOS.'
            'Interactive TUI: .\pickaxe.exe mine. Headless: .\pickaxe.exe mine --no-tui.'
            'NVIDIA CUDA PTX in cuda/build is sm_120 only. A driver that can load sm_120 is required.'
            'NVIDIA CUDA T2 mining uses the Rust backend.'
            'AMD HIP T2 code objects in hip/build/<arch> cover gfx1030, gfx1031, gfx1032, gfx1034, gfx1036, gfx1100, gfx1101, gfx1102, gfx1200, gfx1201 and were built by this workflow.'
            'Each folder also holds photon_rust.hsaco from the shared Rust engine; PICKAXE_HIP_KERNELS=rust selects it, C++ stays the default.'
            'Other AMD and Intel GPUs, and integrated GPUs, mine through the included Vulkan (wgpu) T2 engine.'
            'GPUs no other engine finds mine through the included OpenCL engine.'
            'No CPU mining fallback.'
          ) | Set-Content -LiteralPath (Join-Path $packageDir 'BACKENDS.txt') -Encoding utf8

          if (Test-Path -LiteralPath 'README.md') {
            Copy-Item -LiteralPath 'README.md' -Destination $packageDir
          }
          Get-ChildItem -File -Filter 'LICENSE*' | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $packageDir
          }

          $archive = Join-Path 'dist' ($packageName + '.zip')
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $archive -Force
          Remove-Item -LiteralPath $packageDir -Recurse -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # #### PR #42: the Linux x86_64 binary for older Linux
  # What: `pickaxe` built inside manylinux_2_28 (glibc 2.28; TLS is rustls,
  # so no libssl). The farm-os job checks it and puts it in the Linux x86_64
  # archive in place of the one built on ubuntu-latest.
  # Why: HiveOS is Ubuntu 20.04 (glibc 2.31); the ubuntu-latest build needs
  # a newer glibc.
  # Look here if: this build fails in the container, or the Linux archive or
  # a farm package will not start on an older system.
  linux-compat:
    name: Build Linux x86_64 for older systems
    needs:
      - validate
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install Rust stable
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Build release
        shell: bash
        run: cargo build --locked --release

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compat-linux-x86_64
          path: target/release/pickaxe_miner
          if-no-files-found: error
          retention-days: 14

  # #### PR #42: the HiveOS, mmpOS and RaveOS packages
  # What: checks the older-Linux binary (no glibc newer than 2.28, no
  # libssl or libcrypto), puts it in the Linux x86_64 archive, tests the
  # package scripts, and makes pickaxe-hiveos, pickaxe-mmpos and
  # pickaxe-raveos from that archive (tools/farm-os/build.sh).
  # Why: farm systems install custom miners from release assets.
  # Look here if: a farm system refuses a package, or its miner will not
  # start.
  farm-os:
    name: Farm OS packages
    needs:
      - validate
      - build
      - linux-compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Download the Linux x86_64 archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-linux-x86_64
          path: dist

      - name: Download the older-Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compat-linux-x86_64
          path: compat

      - name: Check the binary and put it in the archive
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          bin=compat/pickaxe_miner
          chmod 0755 "${bin}"
          newest="$(readelf -V "${bin}" | grep -o 'GLIBC_2\.[0-9]*' | sort -u -t. -k2,2n | tail -n 1)"
          echo "Newest glibc symbol: ${newest}"
          if (( ${newest#GLIBC_2.} > 28 )); then
            echo "${bin} needs ${newest}; older Linux cannot run it" >&2
            exit 1
          fi
          if readelf -d "${bin}" | grep -E 'NEEDED.*(libssl|libcrypto)'; then
            echo "${bin} links OpenSSL" >&2
            exit 1
          fi
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test "$("${bin}" --version)" = "pickaxe ${version}"
          package="${TAG}-linux-x86_64"
          tar -C dist -xzf "dist/${package}.tar.gz"
          install -m 0755 "${bin}" "dist/${package}/pickaxe"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"

      - name: Test the package scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck packaging/farm-os/*/*.sh tools/farm-os/build.sh
          python3 -m unittest discover -s tools -p 'test_farm_os_packages.py' -v

      - name: Build the packages
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: tools/farm-os/build.sh "dist/${TAG}-linux-x86_64.tar.gz" farm

      - name: Upload the Linux x86_64 archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-x86_64
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-farm-os
          path: farm/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: Checksum release assets
    needs:
      - validate
      - build
      - farm-os
      - portable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download matching macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pickaxe-macos-arm64-${{ needs.validate.outputs.sha }}
          path: portable/mac

      - name: Download matching browser package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pickaxe-browser-${{ needs.validate.outputs.sha }}
          path: portable/web

      - name: Verify portable package provenance
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          (cd portable/mac && sha256sum -c SHA256SUMS.txt)
          (cd portable/web && sha256sum -c SHA256SUMS.txt)
          test "$(tar -xOf "portable/mac/${TAG}-macos-arm64.tar.gz" "${TAG}-macos-arm64/SOURCE_COMMIT.txt")" = "${SHA}"
          test "$(tar -xOf portable/web/pickaxe-browser.tar.gz web/SOURCE_COMMIT.txt)" = "${SHA}"
          cp "portable/mac/${TAG}-macos-arm64.tar.gz" dist/
          cp portable/web/pickaxe-browser.tar.gz "dist/${TAG}-browser.tar.gz"

      - name: Generate SHA-256 checksums
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          MODE: ${{ needs.validate.outputs.mode }}
          SHA: ${{ needs.validate.outputs.sha }}
          REBUILD_SHA: ${{ inputs.source_commit }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#pickaxe-miner-v}"
          if [[ "pickaxe-miner-v${version}" != "${TAG}" || -z "${version}" ]]; then
            echo "Refusing to checksum unexpected tag ${TAG}" >&2
            exit 1
          fi
          farm="${version//-/_}"
          cd dist
          sha256sum "${TAG}-linux-x86_64.tar.gz" "${TAG}-windows-x86_64.zip" \
            "${TAG}-linux-arm64.tar.gz" "${TAG}-windows-arm64.zip" \
            "${TAG}-macos-arm64.tar.gz" "${TAG}-browser.tar.gz" \
            "pickaxe-hiveos-${farm}.tar.gz" "pickaxe-mmpos-${farm}.tar.gz" \
            "pickaxe-raveos-${farm}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "Pickaxe Miner v${version}"
            echo
            echo "Packages: Windows x86_64, Linux x86_64, Windows ARM64, Linux ARM64, macOS Apple Silicon and browser WebGPU."
            echo "Every package is built from the same source commit."
            echo "Bundled NVIDIA CUDA PTX is sm_120 only."
            echo "NVIDIA CUDA T2 mining uses the Rust backend."
            echo "Bundled AMD HIP T2 code objects cover gfx1030, gfx1031, gfx1032, gfx1034, gfx1036, gfx1100, gfx1101, gfx1102, gfx1200, gfx1201."
            echo "Other AMD and Intel GPUs, and integrated GPUs, mine through the bundled Vulkan (wgpu) T2 engine."
            echo "GPUs no other engine finds mine through the bundled OpenCL engine."
            echo "The ARM64 packages carry the portable and OpenCL engines only, and have not yet been run on ARM hardware."
            echo "Farm systems: pickaxe-hiveos, pickaxe-mmpos and pickaxe-raveos are custom-miner packages (docs/farm-os.md)."
            echo "The Linux x86_64 binary runs on Linux with glibc 2.28 or newer, such as Ubuntu 20.04."
            echo "The default interface is the interactive TUI. Headless mode is --no-tui."
            echo "There is no CPU mining fallback."
            echo "Source commit: ${SHA}"
            if [[ -n "${REBUILD_SHA}" ]]; then
              echo
            echo "Downloads rebuilt $(date -u +%F). Existing installations are unchanged."
              echo "The original tag is unchanged. Updated source: [${SHA}](${SOURCE_URL}/tree/${SHA}) ([archive](${SOURCE_URL}/archive/${SHA}.tar.gz))."
            fi
            echo
            echo "SHA-256"
            cat SHA256SUMS.txt
          } > RELEASE_NOTES.md
          if [[ "${MODE}" == "dry-run" ]]; then
            echo "Dry run: ${TAG} packaging passed; no tag or release was published."
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - checksums
    if: needs.validate.outputs.mode == 'publish' || needs.validate.outputs.mode == 'create'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: dist

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          MODE: ${{ needs.validate.outputs.mode }}
          REBUILD_SHA: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail

          version="${TAG#pickaxe-miner-v}"
          if [[ "pickaxe-miner-v${version}" != "${TAG}" || -z "${version}" ]]; then
            echo "Refusing to publish unexpected tag ${TAG}" >&2
            exit 1
          fi
          release_title="Pickaxe Miner v${version}"

          prerelease_args=()
          if [[ "${version}" == *-* ]]; then
            prerelease_args+=(--prerelease --latest=false)
          fi

          # A new tag is created by the release itself, on the exact commit
          # that was built. Explicit download rebuilds preserve the original
          # tag and identify their merged source commit in the release notes.
          tag_args=(--verify-tag)
          if [[ "${MODE}" == "create" ]]; then
            if tagged="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha 2>/dev/null)"; then
              if [[ "${tagged}" != "${SHA}" ]]; then
                echo "${TAG} already exists on ${tagged}, not ${SHA}" >&2
                exit 1
              fi
            else
              tag_args=(--target "${SHA}")
            fi
          fi

          farm="${version//-/_}"
          assets=(
            "dist/pickaxe-hiveos-${farm}.tar.gz"
            "dist/pickaxe-mmpos-${farm}.tar.gz"
            "dist/pickaxe-raveos-${farm}.zip"
            "dist/${TAG}-linux-x86_64.tar.gz"
            "dist/${TAG}-windows-x86_64.zip"
            "dist/${TAG}-macos-arm64.tar.gz"
            "dist/${TAG}-browser.tar.gz"
            "dist/SHA256SUMS.txt"
          )

          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GH_REPO}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --repo "${GH_REPO}" --target "${SHA}" --notes-file dist/RELEASE_NOTES.md "${prerelease_args[@]}"
          elif [[ -n "${REBUILD_SHA}" ]]; then
            echo "Refusing to create a release during download replacement: ${TAG}" >&2
            exit 1
          else
            gh release create "${TAG}"               --repo "${GH_REPO}"               "${tag_args[@]}"               --title "${release_title}"               --notes-file dist/RELEASE_NOTES.md               "${prerelease_args[@]}"               "${assets[@]}"
          fi
