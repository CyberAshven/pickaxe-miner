[package]
name = "pickaxe_miner"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = { version = "0.10", features = ["compress"] }
ripemd = "0.1"
hex = "0.4"
secp256k1 = { version = "0.33.1", features = ["global-context", "rand"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
cudarc = { version = "0.19.9", features = ["cuda-12000"] }
clap = { version = "4.6.7", features = ["derive"] }
hmac = "0.12"
rand = "0.9"
ctrlc = "3.4"
ratatui = "0.29"
crossterm = "0.28"
libloading = "0.9"
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
