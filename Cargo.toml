[package]
name = "pickaxe_miner"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
hex = "0.4"
secp256k1 = { version = "0.33.1", features = ["global-context", "rand"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
cudarc = { version = "0.19.9", features = ["cuda-12000"] }
