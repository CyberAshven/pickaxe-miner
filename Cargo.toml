[package]
name = "pickaxe_miner"
version = "0.0.3"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Native builds carry the portable T2 engine so AMD and Intel GPUs mine through Vulkan.
default = ["rust-t2", "portable-wgpu", "stratum-v2", "opencl"]
incremental-k = []
tail-grind = []
# Default Rust implementation of the complete CUDA T2 mining path.
# Legacy CUDA C++: --no-default-features --features tail-grind.
rust-t2 = ["tail-grind"]
# GPU V-coordinate diagnostic only; live mining keeps the reward at 700 sats.
tail-value-grind = ["tail-grind"]
portable-wgpu = ["dep:pollster", "dep:wgpu", "shared-rust-t2"]
# Internal compiler selection: portable builds import the native Rust hot path.
shared-rust-t2 = []
# #### PR #22: development-only browser export that checks the portable
# engine against the CPU (tools/build-browser.py --check). Not in releases.
browser-check = ["portable-wgpu"]
# #### PR #32: Stratum V2 for the BCH ASIC server, its firmware adapter and
# the encrypted link between a GPU coordinator and its rigs. In the default
# build since #32; the browser and portable builds choose their own features.
# #### PR #40: the server's device monitoring and control (asic-rs) and the
# runtime it needs come with it.
stratum-v2 = ["dep:stratum-core", "dep:asic-rs", "dep:tokio"]
# #### PR #32: the OpenCL engine for GPUs the other engines cannot drive
# (older integrated GPUs, older cards, ARM GPUs). The OpenCL library is loaded
# at runtime, so builds with it run on machines without one.
opencl = []

[dependencies]
sha2 = "0.11"
stratum-core = { version = "0.6.0", features = ["translation"], optional = true }
ripemd = "0.2"
hex = "0.4"
secp256k1 = { version = "0.33.1", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.5"
num-traits = "0.2"
hmac = "0.13"
rand = "0.10"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "vulkan", "metal", "webgpu", "wgsl"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = "0.2"
cudarc = { version = "0.19.10", features = ["cuda-12000"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = "0.29"
libloading = "0.9"
pollster = { version = "1.0", optional = true }
# #### PR #40: device reports and controls for the ASIC server's workers.
# asic-rs (256 Foundation, Apache-2.0) knows most SHA-256 makes and firmwares;
# Pickaxe's own CGMiner and Bitaxe code extends it (src/stratum_v2/fleet.rs).
asic-rs = { version = "0.8.5", optional = true }
tokio = { version = "1.50", optional = true, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
# Builds asic-rs test data (temperatures, fan speeds) in fleet tests.
measurements = "0.11"

[build-dependencies]
sha2 = "0.11"

# #### PR #32: wgpu 30 crashes older Vulkan drivers
# What: third_party/wgpu-hal is the published wgpu-hal 30.0.1 plus upstream's
# 11-line fix (gfx-rs/wgpu#10124, merged for wgpu's next release): a
# descriptor pool never has zero pool sizes.
# Why: wgpu 30 creates an empty bind group layout, and with it a descriptor
# pool without pool sizes, inside `request_device`. Vulkan allowed that only
# from 1.3.215; Intel's driver for HD 520 and UHD 630 (igvk64.dll) crashes
# with an access violation, so the portable engine stopped before printing
# anything (issue #30, gfx-rs/wgpu#9845).
# Check: drop this patch once a wgpu-hal release contains #10124.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
