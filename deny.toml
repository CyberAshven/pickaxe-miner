[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# chrono and chrono-tz are marked unmaintained (no vulnerability); asic-rs
# (the ASIC server's device reports) still depends on them through
# asic-rs-core, up to its latest release 0.8.10. Drop these once it moves
# to jiff or time.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; only through asic-rs" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; only through asic-rs" },
]

[licenses]
# CC0-1.0: the secp256k1 crates (libsecp256k1 bindings) used for signing.
allow = ["AGPL-3.0-only", "Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0"]

# PR #38: bitcoin 0.32 via the reference Stratum crates uses this unmodified
# compile-time hex macro. MITNFA retains MIT notice requirements and adds a
# condition about bug-report attribution for substantially modified copies.
# Reviewed text: https://spdx.org/licenses/MITNFA.html. Scope to this crate;
# advisory, source and all other license gates remain in force.
[[licenses.exceptions]]
name = "hex_lit"
version = "=0.1.1"
allow = ["MITNFA"]

# PR #40: asic-rs (device reports and controls for the ASIC server) uses
# reqwest with rustls, whose platform verifier ships Mozilla's root
# certificates as data under CDLA-Permissive-2.0, a permissive data license
# that sets no conditions on software using the data. Reviewed text:
# https://spdx.org/licenses/CDLA-Permissive-2.0.html. Scope to this crate.
[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.10"
allow = ["CDLA-Permissive-2.0"]

# The desktop window (`gui` feature): egui's clipboard on Windows (arboard)
# uses these two crates under the Boost Software License 1.0, a permissive
# license that asks only to keep its notice with source copies. Reviewed text:
# https://spdx.org/licenses/BSL-1.0.html. Scope to these crates.
[[licenses.exceptions]]
name = "clipboard-win"
version = "=5.4.3"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
version = "=3.4.0"
allow = ["BSL-1.0"]

# The desktop window's text: egui's bundled fonts, Hack and Noto Emoji under
# the SIL Open Font License 1.1 and Ubuntu under the Ubuntu Font Licence 1.0.
# Both allow bundling the fonts unmodified with any software; they only limit
# selling the fonts alone and reusing their names for modified fonts.
# Reviewed texts: https://spdx.org/licenses/OFL-1.1.html and
# https://spdx.org/licenses/Ubuntu-font-1.0.html. Scope to this crate.
[[licenses.exceptions]]
name = "epaint_default_fonts"
version = "=0.37.0"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
# Different compatible dependency trees may need different crate major versions.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/CyberAshven/UltrafastSecp256k1.git"]
