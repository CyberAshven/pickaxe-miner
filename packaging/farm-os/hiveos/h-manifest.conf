# #### PR #42: HiveOS custom miner manifest (hive/miners/custom/README.md).
# The release asset pickaxe-hiveos-VERSION.tar.gz holds the folder
# pickaxe-hiveos/, so custom-get names the miner pickaxe-hiveos.
CUSTOM_NAME=pickaxe-hiveos
CUSTOM_VERSION=@VERSION@
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/pickaxe-hiveos/pickaxe.args
CUSTOM_LOG_BASENAME=/var/log/miner/pickaxe-hiveos/pickaxe
