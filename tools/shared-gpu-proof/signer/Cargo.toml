[package]
name = "pickaxe-shared-signer"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["rlib", "dylib"]

[features]
# Development-only arithmetic entry point; never part of the shipped shader.
debug = []

[dependencies]
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "e2e4d529a5ead1364228530d301ebbca4ef90262" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }
